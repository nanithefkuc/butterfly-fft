name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  # The dispatch layer picks one backend per process, so a single test run only
  # ever exercises the host's best. Re-run the suite pinned to each weaker
  # backend the host can still execute.
  backends:
    name: backend sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: v3_gfni_crypto
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: v3
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: v2
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: scalar

  # Line coverage of the crate's own source must stay at or above 95%.
  # The dispatch layer picks one backend per process, so the runs are
  # merged — one per forced SIMD_BACKEND tier, plus the
  # no-default-features (portable no_std) suite, whose compiled line set
  # differs — before the report gates.
  coverage:
    name: coverage >=95% (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: scalar
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v2
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v3
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v3_gfni_crypto
      - run: cargo llvm-cov --no-report --no-default-features
      - run: cargo llvm-cov report --summary-only --ignore-filename-regex 'kernel/x86/gfni\.rs$'
      - run: cargo llvm-cov report --fail-under-lines 95 --ignore-filename-regex 'kernel/x86/gfni\.rs$' --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage.lcov

  cross:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --target ${{ matrix.target }}

  msrv:
    name: msrv 1.93
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: cargo build --all-features

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Enforce absolute `::core` / `::std` paths in crate code, so a future
      # module can never shadow a sysroot name.
      - name: sysroot paths must be absolute
        run: '! grep -rnE "^\s*use (core|std)::" src/'

  miri:
    name: miri (scalar paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Miri cannot execute the SIMD intrinsics; pin to the portable backend so
      # it validates the slice and pointer arithmetic in the wrappers instead.
      - run: cargo miri test --no-default-features
