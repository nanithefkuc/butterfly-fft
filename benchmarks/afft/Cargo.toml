[package]
name = "butterfly-fft-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[build-dependencies]
cc = "1"

[dev-dependencies]
butterfly-fft = { path = "../..", features = ["internals"] }
additive-fft-reed-solomon = { git = "https://github.com/vkomenda/additive-fft-reed-solomon", rev = "f1bcc91102b74f860c93dcf0b75887ff85755564", features = ["compile_gfni"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
fgf = "=1.0.0"

[[bench]]
name = "raw_afft"
harness = false

[[bench]]
name = "ntt_competitor"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1
