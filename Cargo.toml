[package]
name = "cafft"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Common Additive Fast Fourier Transform: shared additive-FFT engine over binary fields"
repository = "https://github.com/nanithefkuc/cafft"
license = "MIT"
readme = "README.md"
keywords = ["galois", "finite-field", "fft", "erasure", "reed-solomon"]
categories = ["algorithms", "mathematics", "no-std"]
exclude = ["/.github", "/.plans", "/benchmarks"]

[features]
default = ["std", "simd"]
# Standard library. Required for the shared transform-plan caches and the
# `simdispatch` runtime detection selected by `simd`.
std = ["fff/std"]
# Runtime-dispatched SIMD butterfly kernels (v3_gfni_crypto / v3 / v2 on x86,
# neon on AArch64). Disabling leaves the portable scalar backend.
simd = ["std", "fff/simd"]
# RS-facing erasure algebra: locator evaluation, Forney-style recovery,
# systematic-locator caches, strip-blocked encode skeletons.
rs = ["std"]
# Expose unstable implementation APIs for experimentation and downstream
# tuning. Exempt from this crate's compatibility guarantees.
internals = []

[dependencies]
# Level 0 single source for SIMD capability selection; pinned to the
# `v0.0.0` tag. `fff` is pinned to the post-P2 `backend/simdispatch` head so
# the two resolve the same `SIMD_BACKEND` (both re-export simdispatch's
# ladder). Swap these revs with the dependents in the same sitting.
simdispatch = { git = "https://github.com/nanithefkuc/simdispatch", rev = "5940194107384953cd8cd9f45c8d902b26d5686e" }
fff = { git = "https://github.com/nanithefkuc/fff.git", rev = "5f4c04a25cd4855bc1f7035d62b3b96eef83965e" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
lto = "thin"
codegen-units = 1
