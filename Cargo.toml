[package]
name = "butterfly-fft"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Common Additive Fast Fourier Transform: shared additive-FFT engine over binary fields"
repository = "https://github.com/nanithefkuc/butterfly-fft"
license = "MIT"
readme = "README.md"
keywords = ["galois", "finite-field", "fft", "additive-fft", "simd"]
categories = ["algorithms", "mathematics", "no-std"]
exclude = ["/.github", "/.plans", "/benchmarks"]

[features]
default = ["std", "simd"]
# Standard library. Required for the shared transform-plan caches and the
# `simdispatch` runtime detection selected by `simd`.
std = ["fgf/std"]
# Runtime-dispatched SIMD butterfly kernels (v3_gfni_crypto / v3 / v2 on x86,
# neon on AArch64). Disabling leaves the portable scalar backend.
simd = ["std", "fgf/simd"]
# Expose unstable implementation APIs for experimentation and downstream
# tuning. Exempt from this crate's compatibility guarantees.
internals = []

[dependencies]
# Level 0 single source for SIMD capability selection, taken from the
# registry at the exact release `fgf` resolves, so both crates compile one
# `simdispatch` and share its `Backend` type and `SIMD_BACKEND` ladder. `fgf`
# is pinned by rev; swap it with the dependents in the same sitting.
simdispatch = { version = "=0.1.0", default-features = false }
fgf = { git = "https://github.com/nanithefkuc/fgf", rev = "b33b441bcff60da80354bfee6050db4aeab6295c", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ntt"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
lto = "thin"
codegen-units = 1

# Release codegen a profiler can attribute: opt-level 3 with full debug info
# and no symbol stripping. Frame pointers come from RUSTFLAGS in `just
# profile-perf`, since they are not a Cargo profile key.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
