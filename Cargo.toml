[package]
name = "butterfly-fft"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
description = "Additive FFT and NTT transform plans over finite fields"
repository = "https://github.com/nanithefkuc/butterfly-fft"
license = "MIT"
readme = "README.md"
keywords = ["galois", "finite-field", "fft", "ntt", "simd"]
categories = ["algorithms", "mathematics", "no-std"]
# Intentional package allowlist: the library source, the declared bench and
# test targets, and the public doc set. Local tooling state, planning notes,
# CI definitions, and the competitor benchmark harness never enter
# `cargo package`.
include = [
    "src/**",
    "benches/**",
    "tests/**",
    "/README.md",
    "/CHANGELOG.md",
    "/BENCHMARKS.md",
    "/LICENSE",
]

[features]
default = ["std", "simd"]
# Standard library. Required for the shared transform-plan caches and the
# `simdispatch` runtime detection selected by `simd`.
std = ["fgf/std"]
# Runtime-dispatched SIMD butterfly kernels (v3_gfni_crypto / v3 / v2 on x86,
# neon on AArch64), as safe `archmage` capability-token functions. Disabling
# leaves the portable scalar backend.
simd = ["std", "fgf/simd", "dep:archmage"]
# Expose unstable implementation APIs for experimentation and downstream
# tuning. Exempt from this crate's compatibility guarantees.
internals = []

[dependencies]
# Level 0 single source for SIMD capability selection, taken from the
# registry at the exact release `fgf` resolves, so both crates compile one
# `simdispatch` and share its `Backend` type and `SIMD_BACKEND` ladder.
simdispatch = { version = "=0.1.0", default-features = false }
# Capability tokens for the butterfly kernels, owned by `simd` (the feature
# that compiles the kernels naming them), at the exact release `fgf` resolves
# so both crates compile one `archmage`.
archmage = { version = "=0.9.29", optional = true }
fgf = { version = "=1.2.0", default-features = false }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ntt"
harness = false

[[bench]]
name = "ntt_tuning"
harness = false
required-features = ["internals"]

[[test]]
name = "backend_report"
harness = false


[[test]]
name = "factor_table"
required-features = ["internals"]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
lto = "thin"
codegen-units = 1

# Release codegen a profiler can attribute: opt-level 3 with full debug info
# and no symbol stripping. Frame pointers come from RUSTFLAGS in `just
# profile-perf`, since they are not a Cargo profile key.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
